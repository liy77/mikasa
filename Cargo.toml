[workspace]
members = [".", "crates/mikasa-syntax", "crates/mikasa-parser", "crates/mikasa-lsp", "crates/mui-syntax", "crates/mui-codegen", "crates/mui-lsp", "crates/astra-vm", "crates/mika-import"]
# `dist/rust` is the output dir for cforge-transpiled programs; it has its
# own Cargo.toml that must NOT be a workspace member. The installer-gui
# is its own self-contained Tauri app — also kept out.
exclude = ["dist", "installer-gui", "alloy-gui", "examples/mika-import-rs"]
resolver = "2"

[package]
name = "mikasa"
version = "0.1.0-beta.0"
edition = "2021"
build = "build.rs"
authors = ["Liy", "Copper Authors"]

[[bin]]
name = "mikasa"
path = "src/main.rs"

[dependencies]
mikasa-syntax = { path = "crates/mikasa-syntax" }
mikasa-parser = { path = "crates/mikasa-parser" }
astra-vm = { path = "crates/astra-vm" }
mui-syntax = { path = "crates/mui-syntax" }
mui-codegen = { path = "crates/mui-codegen" }
clap = "4.6.1"
colored = "3.1.1"
once_cell = "1.21.4"
regex = "1.12.3"
reqwest = "0.13.4"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
quick-xml = "0.40.1"
walkdir = "2.5.0"
sha2 = "0.10"
lson = { path = "lson-src" }
