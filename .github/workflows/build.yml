name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: mikasa
            asset: mikasa-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: mikasa.exe
            asset: mikasa-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: mikasa
            asset: mikasa-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: mikasa
            asset: mikasa-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build mikasa
        run: cargo build --release --target ${{ matrix.target }} -p mikasa --bin mikasa

      - name: Strip (Unix)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/mikasa || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-test-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test -p mikasa-syntax -p mikasa-parser -p astra-vm --verbose
      - run: cargo clippy -p mikasa -p astra-vm -p mikasa-syntax -- -D warnings
      - run: cargo fmt --check

  # Stable v* tags also get a release via `.github/workflows/release.yml`
  # (which builds the full SDK). This job stays as a lightweight CI gate only.
