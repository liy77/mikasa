<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0a10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>__APP_TITLE__</title>
<meta name="apple-mobile-web-app-title" content="__APP_TITLE__">
<meta name="mocidad-build-id" content="__BUILD_ID__">
<meta name="mocidad-built-at" content="__BUILT_AT__">
<link rel="preload" href="build-id.json" as="fetch" crossorigin fetchpriority="high">
<link rel="preload" href="build-gate.js" as="script" fetchpriority="high">
<!-- No `crossorigin` on wasm: Safari treats CORS-mode preload without ACAO as
     a failed stream and Emscripten aborts with "both async and sync fetching
     of wasm failed". Same-origin fetch does not need CORS. -->
<link rel="preload" href="mui_dev.wasm?v=__BUILD_ID__" as="fetch" type="application/wasm" fetchpriority="high">
<link rel="preload" href="mui-dev.js?v=__BUILD_ID__" as="script" fetchpriority="high">
<link rel="preload" href="main.mika?v=__BUILD_ID__" as="fetch" fetchpriority="high">
<link rel="preload" href="app.mui?v=__BUILD_ID__" as="fetch" fetchpriority="high">
<link rel="preload" href="fonts/Inter-Regular.ttf?v=__BUILD_ID__" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="logo.png?v=__BUILD_ID__" as="image" fetchpriority="high">
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0a10;
    --ink: #f0ebe3;
    --muted: #8a8478;
    --gold: #c9a84a;
    --gold-dim: #c9a84a55;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
    max-width: 100%; max-height: 100dvh;
    background: var(--bg); overflow: hidden; overscroll-behavior: none;
    position: fixed; inset: 0;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  #canvas {
    display: block; position: fixed; left: 0; top: 0;
    width: 100%; height: 100%; height: 100dvh;
    max-width: 100vw; max-height: 100dvh;
    background: var(--bg); touch-action: none; opacity: 1; z-index: 1;
    object-fit: fill;
  }
  #boot {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding:
      max(24px, var(--safe-t))
      max(28px, var(--safe-r))
      max(28px, var(--safe-b))
      max(28px, var(--safe-l));
    gap: 0;
    background:
      radial-gradient(ellipse 80% 55% at 50% 38%, #1a1612 0%, transparent 70%),
      radial-gradient(ellipse 100% 80% at 50% 100%, #000000ee 0%, transparent 55%),
      linear-gradient(180deg, #121014 0%, #0c0a10 48%, #08070b 100%);
    transition: opacity 280ms ease;
    box-sizing: border-box;
  }
  #boot::before {
    content: "";
    position: absolute; inset: 0; pointer-events: none; opacity: 0.07;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px 180px;
  }
  #boot[data-done="1"] { opacity: 0; }
  #boot-brand {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    gap: 18px;
    width: min(82vw, 340px);
    margin-bottom: 56px;
    animation: bootRise 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  #boot-logo {
    display: block;
    width: 100%;
    height: auto;
    max-height: 22vh;
    object-fit: contain;
    filter: drop-shadow(0 8px 28px rgba(0,0,0,0.55));
  }
  #boot-tag {
    margin: 0;
    font: 500 12px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
    opacity: 0.9;
  }
  #boot-tag:empty { display: none; }
  #boot-foot {
    position: absolute;
    left: max(28px, var(--safe-l));
    right: max(28px, var(--safe-r));
    bottom: max(28px, var(--safe-b));
    display: flex; flex-direction: column; gap: 10px;
    animation: bootRise 700ms 120ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  #boot-meta {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px;
    font: 600 11px/1.2 ui-sans-serif, system-ui, -apple-system, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #boot-label { opacity: 0.95; color: rgba(240, 235, 227, 0.78); }
  #boot-pct {
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    min-width: 3.2em;
    text-align: right;
    letter-spacing: 0.04em;
  }
  #boot-track {
    width: 100%; height: 2px;
    background: rgba(240, 235, 227, 0.1);
    overflow: hidden;
  }
  #boot-bar {
    height: 100%; width: 8%;
    background: linear-gradient(90deg, #8a6a2e, var(--gold), #f0ebe3);
    transform-origin: left center;
    transition: width 160ms ease-out;
    animation: bootPulse 1.25s ease-in-out infinite;
  }
  @keyframes bootPulse {
    0%, 100% { filter: brightness(1); opacity: 1; }
    50% { filter: brightness(1.2); opacity: 0.92; }
  }
  @keyframes bootRise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #err {
    position: fixed; left: max(8px, var(--safe-l)); top: max(8px, var(--safe-t));
    right: max(8px, var(--safe-r)); margin: 0; color: #ffb4a8;
    font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap;
    z-index: 9; pointer-events: none; max-height: 40vh; overflow: hidden;
  }
</style>
</head>
<body>
<canvas id="canvas" width="300" height="150" tabindex="0" aria-label="__APP_TITLE__"></canvas>
<div id="boot" aria-live="polite">
  <div id="boot-brand">
    <img id="boot-logo" src="logo.png?v=__BUILD_ID__" alt="__APP_TITLE__" width="340" height="82" decoding="async" onerror="this.style.display='none'">
    <p id="boot-tag">__BOOT_TAGLINE__</p>
  </div>
  <div id="boot-foot">
    <div id="boot-meta"><span id="boot-label">__BOOT_LOADING__</span><span id="boot-pct">0%</span></div>
    <div id="boot-track"><div id="boot-bar"></div></div>
  </div>
</div>
<pre id="err"></pre>
<!-- build-gate.js: compare build-id, purge Cache Storage on code change, then load boot + wasm glue. -->
<script src="build-gate.js"></script>
</body>
</html>
