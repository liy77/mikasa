[package]
name = "astra-vm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "astra"
path = "src/bin/astra.rs"

[lib]
name = "astra_vm"
path = "src/lib.rs"

[dependencies]
mikasa-syntax = { path = "../mikasa-syntax" }
clap = { version = "4", features = ["derive"] }
# stdlib nativa (json/crypto/http) — mesmos crates que o cforge injeta.
serde = "1"
serde_json = "1"
bincode = "1"
sha2 = "0.10"
hmac = "0.12"
ureq = "2"
wasmi = "1.1.0"

[dev-dependencies]
wat = "1.252.0"
