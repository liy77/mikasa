[package]
name = "mikasa-syntax"
version = "0.0.1-pre-alpha"
edition = "2021"
description = "Tokenizer and AST for the Mikasa language. Shared between mikasa (the transpiler) and mikasa-lsp (the language server)."

[dependencies]
serde = { version = "1", features = ["derive"] }
once_cell = "1.21.3"
regex = "1.11.2"
